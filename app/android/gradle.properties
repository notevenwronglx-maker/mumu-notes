org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
android.builtInKotlin=true
# Flutter mistakes AGP 9.4's bundled Kotlin 2.2.10 for an outdated KGP.
# https://github.com/flutter/flutter/issues/192167
# Remove this when Flutter's built-in Kotlin version check is fixed.
skipDependencyChecks=true

# Disable Kotlin incremental compilation to prevent Windows cross-drive (C:\ Pub Cache vs D:\ Project)
# IllegalArgumentException: "this and base files have different roots" in caches-jvm
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
